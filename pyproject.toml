[project]
name = "connexplorer"
version = "0.1.0"
description = "Fast, polars-native access to fly connectomes (FlyWire FAFB, Male CNS): connectivity, synapses, morphology, cable models, viewers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14",
    "click>=8.0",
    "rich>=13.0",
    "navis>=1.9",
    "plotly>=5.0",
    "matplotlib>=3.7",
]

[project.scripts]
connexplorer = "connexplorer.cli:cli"

[project.optional-dependencies]
notebooks = ["ipykernel>=6", "jupyterlab>=4"]

[dependency-groups]
dev = ["pytest>=8.0", "nbformat>=5.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["connexplorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real connectome data"]
